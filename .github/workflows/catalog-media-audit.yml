name: Auditar todas as fotos do CoreMotion
on:
  pull_request:
    branches: [main]
jobs:
  media-audit:
    if: github.head_ref == 'fix/catalog-media-quality-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar tamanhos e descrições ausentes
        run: node scripts/catalog-metadata-recover.mjs
      - name: Testar rotas de fotos Shopify em fornecedores oficiais
        run: node scripts/catalog-shopify-image-check.mjs
