name: Publicar tag v1.0.0 (execucao unica)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publicar-tag:
    if: github.event.head_commit.message == 'chore(release): publish v1.0.0 tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter historico do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar tag imutavel no commit validado
        env:
          TARGET_COMMIT: d43d774c4e5b8c464f8858632f1af1704c486a5d
          TAG_NAME: v1.0.0
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_COMMIT}^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}"; then
            echo "Tag ja existe; nao sobrescrever."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" "${TARGET_COMMIT}" -m "CoreMotion ${TAG_NAME}: snapshot do codigo publicado em producao; homologacao E2E pendente"
          git push origin "refs/tags/${TAG_NAME}"
