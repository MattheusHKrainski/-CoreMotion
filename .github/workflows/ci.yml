name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicativo:
    name: Tipos, lint, build e teste de API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificação de tipos
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build de produção
        run: npm run build

      - name: Subir o servidor de produção
        run: |
          npm run start -- -p 3000 -H 127.0.0.1 > servidor.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 1
          done

      - name: Teste de fumaça das rotas de API
        run: BASE_URL=http://127.0.0.1:3000 bash scripts/smoke-api.sh

      - name: Log do servidor (somente em caso de falha)
        if: failure()
        run: cat servidor.log || true

  banco-de-dados:
    name: Testes de autorização do banco (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: database/tests/package-lock.json

      - name: Instalar dependências dos testes
        run: npm ci --prefix database/tests

      - name: Executar testes de autorização do banco
        run: npm run test:db
