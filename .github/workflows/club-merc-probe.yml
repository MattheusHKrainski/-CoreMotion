name: Verificar uniformes oficiais dos clubes
on:
  pull_request:
    branches: [main]
jobs:
  verify-club-products:
    if: github.head_ref == 'feat/team-filters-dark-products-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/club-merc-probe.mjs
